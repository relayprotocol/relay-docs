name: Sync Supported Chains

# Supported Chains renders its tables in the browser from /chains, so agents reading the
# page's Markdown export see the generated snippets instead. This keeps them current by
# opening (or updating) a pull request whenever /chains changes. Same flow as Sync Changelog.

on:
  schedule:
    # Offset from Sync Changelog (:17) and Sync API Reference (:37).
    - cron: "47 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build-chains.mjs"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-chains
  cancel-in-progress: false

env:
  SYNC_BRANCH: bot/chains-sync
  SNIPPETS: snippets/supported-chains-mainnets.mdx snippets/supported-chains-testnets.mdx

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Rebuild chain snippets
        run: node scripts/build-chains.mjs

      - name: Open or update the sync pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Retire the sync branch only if its whole tree matches main: deleting a PR head
          # branch closes the PR, and the branch may hold edits this job did not make.
          if git diff --quiet -- $SNIPPETS; then
            echo "chain snippets already match main"
            if git ls-remote --exit-code --heads origin "$SYNC_BRANCH" >/dev/null 2>&1; then
              if git diff --quiet "origin/main" "origin/$SYNC_BRANCH"; then
                echo "main has caught up and the sync branch carries nothing; deleting it"
                git push origin --delete "$SYNC_BRANCH"
              else
                echo "::warning::$SYNC_BRANCH still differs from main — leaving it, and any open pull request, alone"
              fi
            fi
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Resolved before the content check: matching content only means "nothing to do" when
          # a PR is actually open on the branch.
          state=$(gh pr view "$SYNC_BRANCH" --json state --jq .state 2>/dev/null || echo NONE)

          git checkout -B "$SYNC_BRANCH"
          git add $SNIPPETS
          git commit -m "docs: sync supported chains"

          if [ "$state" = "OPEN" ] && git diff --quiet "origin/$SYNC_BRANCH" HEAD -- $SNIPPETS 2>/dev/null; then
            echo "the open pull request already carries these chains"
            exit 0
          fi

          git push --force origin "$SYNC_BRANCH"

          if [ "$state" = "OPEN" ]; then
            echo "updated the open pull request"
            exit 0
          fi

          gh pr create \
            --base main \
            --head "$SYNC_BRANCH" \
            --title "docs: sync supported chains" \
            --body 'Generated by `scripts/build-chains.mjs` from the live `/chains` API (mainnets and testnets). These tables are the agent-facing copy of Supported Chains; the page still renders the live table for readers. The branch is rebuilt on every sync, so the diff shows every chain change since the last merge.'
