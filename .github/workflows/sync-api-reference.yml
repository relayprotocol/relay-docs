name: Sync API Reference

# The API endpoint pages render from the live OpenAPI spec at build time — the MDX files are
# only stubs naming an operation (AGENTS.md §3.3). So the published reference picks up an API
# change when the docs redeploy, and nothing in this repo changes when the solver ships. Left
# alone the reference can sit stale indefinitely; this queues a Mintlify deployment hourly.
#
# It writes nothing — no checkout, no commit, no pull request. The hourly unit of work is the
# deployment itself, not a diff for someone to review and merge.

on:
  schedule:
    # Offset from Sync Changelog's :17 so the two never queue a deployment in the same minute.
    - cron: "37 * * * *"
  workflow_dispatch:

# Touches nothing in the repo; the Mintlify credentials do all the work. actions: read is only
# for looking up the previous run's conclusion, so Slack hears about a change, not every hour.
permissions:
  actions: read

concurrency:
  group: sync-api-reference
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Queue a deployment and wait for it
        id: deploy
        env:
          MINTLIFY_API_KEY: ${{ secrets.MINTLIFY_API_KEY }}
          MINTLIFY_PROJECT_ID: ${{ secrets.MINTLIFY_PROJECT_ID }}
        run: |
          set -euo pipefail

          if [ -z "${MINTLIFY_API_KEY:-}" ] || [ -z "${MINTLIFY_PROJECT_ID:-}" ]; then
            echo "::error::MINTLIFY_API_KEY and MINTLIFY_PROJECT_ID must both be set as repository secrets"
            exit 1
          fi

          status_id=$(
            curl -sS --fail-with-body --max-time 30 --retry 3 --retry-connrefused -X POST \
              -H "Authorization: Bearer $MINTLIFY_API_KEY" \
              "https://api.mintlify.com/v1/project/update/$MINTLIFY_PROJECT_ID" \
            | jq -er '.statusId'
          )
          echo "queued deployment $status_id"

          # Polled rather than fire-and-forget. A deployment that fails — an unreachable or
          # invalid hosted OpenAPI file being the usual cause — is exactly what this job is in
          # a position to notice first, and a green check over a failed deploy would bury that
          # an hour at a time.
          #
          # A poll that cannot reach the API is not the same as a failed deployment, so the
          # request retries rather than failing the run on one bad response; the deadline below
          # is what ends a poll that never resolves.
          deadline=$(( SECONDS + 900 ))
          while [ "$SECONDS" -lt "$deadline" ]; do
            sleep 20

            body=$(curl -sS --fail-with-body --max-time 30 --retry 3 --retry-all-errors \
              -H "Authorization: Bearer $MINTLIFY_API_KEY" \
              "https://api.mintlify.com/v1/project/update-status/$status_id") || continue

            case "$(jq -er '.status' <<<"$body" || echo unknown)" in
              success)
                echo "deployment succeeded"
                exit 0
                ;;
              failure)
                summary=$(jq -r '.summary // "no summary" | gsub("\n"; " ")' <<<"$body")
                echo "summary=$summary" >> "$GITHUB_OUTPUT"
                echo "::error::Mintlify deployment $status_id failed: $summary"
                jq -r '.logs[]? | "  " + .' <<<"$body"
                exit 1
                ;;
              queued | in_progress)
                ;;
              *)
                echo "::error::unexpected status for deployment $status_id"
                exit 1
                ;;
            esac
          done

          echo "::error::deployment $status_id did not finish within 15 minutes"
          exit 1

      # Alerts on the first failure and on recovery only. A broken deploy otherwise fails every
      # hour, and an hourly repeat of the same alert gets muted.
      - name: Decide whether to alert
        id: alert
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.deploy.outcome }}
          SUMMARY: ${{ steps.deploy.outputs.summary }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # The current run is still in progress, so the newest completed run is the previous one.
          previous=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/sync-api-reference.yml/runs?status=completed&per_page=1" \
            --jq '.workflow_runs[0].conclusion // ""')
          echo "previous run: ${previous:-none}, this run: $OUTCOME"

          if [ "$OUTCOME" = "failure" ] && [ "$previous" != "failure" ]; then
            title="Mintlify deployment failed"
            emoji=":rotating_light:"
            detail="${SUMMARY:-See the run logs.}"
          elif [ "$OUTCOME" = "success" ] && [ "$previous" = "failure" ]; then
            title="Mintlify deployment recovered"
            emoji=":white_check_mark:"
            detail="Docs are deploying again."
          else
            echo "send=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          payload=$(jq -nc --arg title "$title" --arg emoji "$emoji" --arg detail "$detail" --arg url "$RUN_URL" '{
            text: $title,
            blocks: [{
              type: "section",
              text: { type: "mrkdwn", text: ($emoji + " *" + $title + "*\n" + $detail) },
              accessory: {
                type: "button",
                text: { type: "plain_text", text: "View run" },
                url: $url
              }
            }]
          }')
          echo "send=true" >> "$GITHUB_OUTPUT"
          echo "payload=$payload" >> "$GITHUB_OUTPUT"

      - name: Post to Slack
        if: always() && steps.alert.outputs.send == 'true'
        uses: unevenlabs/slack-github-action@v1.0.5
        with:
          channel-id: "team-dx-alarms"
          payload: ${{ steps.alert.outputs.payload }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
